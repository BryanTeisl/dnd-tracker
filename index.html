<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5e Initiative & Status Board</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for webkit to match the dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827; 
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; 
        }
        
        /* Smooth transitions for active turn highlights */
        .combatant-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 border-b border-gray-800 pb-4 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Encounter Board <span class="text-indigo-500 font-black">5e</span></h1>
                <p class="text-sm text-gray-400 mt-1">Initiative, HP, and Status Tracker</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-center">
                    <span class="text-xs text-gray-400 uppercase font-bold tracking-wider block">Round</span>
                    <span id="round-display" class="text-xl font-bold text-white">1</span>
                </div>
                <button id="btn-next-turn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 px-6 rounded-lg shadow-lg hover:shadow-indigo-500/20 transition-all duration-200 flex items-center gap-2">
                    Next Turn
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
                <button id="btn-clear" class="bg-red-900/50 hover:bg-red-700 border border-red-800 text-red-200 text-sm font-medium py-2 px-4 rounded-lg transition-colors">
                    Clear Encounter
                </button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Sidebar: Add Combatant Form -->
            <div class="lg:col-span-4">
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-xl sticky top-8">
                    <h2 class="text-xl font-semibold text-white mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                        Add Combatant
                    </h2>
                    
                    <form id="add-combatant-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Name</label>
                            <input type="text" id="input-name" required class="w-full bg-gray-850 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-gray-600" placeholder="e.g., Goblin, Eldon">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Initiative</label>
                                <input type="number" id="input-init" required class="w-full bg-gray-850 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., 18">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Max HP</label>
                                <input type="number" id="input-hp" required min="1" class="w-full bg-gray-850 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., 25">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Role</label>
                            <div class="flex bg-gray-850 rounded-md p-1 border border-gray-700">
                                <label class="flex-1 text-center cursor-pointer">
                                    <input type="radio" name="role" value="player" checked class="peer sr-only">
                                    <div class="py-2 text-sm font-medium rounded text-gray-400 peer-checked:bg-blue-900/40 peer-checked:text-blue-300 peer-checked:shadow-sm transition-all">Player</div>
                                </label>
                                <label class="flex-1 text-center cursor-pointer">
                                    <input type="radio" name="role" value="monster" class="peer sr-only">
                                    <div class="py-2 text-sm font-medium rounded text-gray-400 peer-checked:bg-red-900/40 peer-checked:text-red-300 peer-checked:shadow-sm transition-all">Monster</div>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-medium py-2.5 rounded-md transition-colors mt-2">
                            Add to Initiative
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Area: Initiative Tracker List -->
            <div class="lg:col-span-8">
                <div class="flex justify-between items-end mb-4">
                    <h2 class="text-xl font-semibold text-white">Active Order</h2>
                    <span class="text-sm text-gray-400" id="combatant-count">0 Combatants</span>
                </div>
                
                <div id="initiative-list" class="space-y-3 pb-20">
                    <!-- Combatant Cards injected via JS -->
                </div>
                
                <!-- Empty State (Shown when no combatants exist) -->
                <div id="empty-state" class="hidden flex-col items-center justify-center py-16 px-4 border-2 border-dashed border-gray-800 rounded-xl bg-gray-900/50">
                    <svg class="w-12 h-12 text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <p class="text-gray-400 text-center">The board is empty.</p>
                    <p class="text-sm text-gray-500 mt-1">Add players and monsters using the form to begin.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        /**
         * D&D 5e Initiative & Status Board
         */

        // ==========================================
        // 1. STATE MANAGEMENT
        // ==========================================
        
        const STORAGE_KEY = 'dnd-encounter-state';
        const PARTY_STORAGE_KEY = 'dnd-parties';

        const CONDITIONS = [
            'Blinded', 'Charmed', 'Deafened', 'Exhaustion', 'Frightened', 
            'Grappled', 'Incapacitated', 'Invisible', 'Paralyzed', 'Petrified', 
            'Poisoned', 'Prone', 'Restrained', 'Stunned', 'Unconscious'
        ];

        // Active encounter state
        let state = {
            combatants: [], 
            activeTurnId: null, 
            round: 1
        };

        // Saved party presets state
        let savedParties = [];

        function loadState() {
            // Load Encounter
            const savedEncounter = localStorage.getItem(STORAGE_KEY);
            if (savedEncounter) {
                try {
                    state = JSON.parse(savedEncounter);
                    state.combatants.forEach(c => {
                        if (!c.conditions) c.conditions = [];
                    });
                } catch (e) {
                    console.error("Failed to parse encounter state", e);
                }
            }

            // Load Saved Parties
            const storedParties = localStorage.getItem(PARTY_STORAGE_KEY);
            if (storedParties) {
                try {
                    savedParties = JSON.parse(storedParties);
                } catch (e) {
                    console.error("Failed to parse parties state", e);
                }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function savePartiesState() {
            localStorage.setItem(PARTY_STORAGE_KEY, JSON.stringify(savedParties));
        }

        // --- NEW: Party Preset Logic ---

        function saveCurrentParty(partyName) {
            if (!partyName || partyName.trim() === '') return;

            // Extract only the players and strip transient encounter data
            const players = state.combatants
                .filter(c => c.role === 'player')
                .map(p => ({
                    name: p.name,
                    maxHp: p.maxHp,
                    role: 'player'
                }));
            
            if (players.length === 0) {
                alert("No players in the current encounter to save.");
                return;
            }

            // Overwrite if party name exists, otherwise add new
            const existingIndex = savedParties.findIndex(p => p.name.toLowerCase() === partyName.toLowerCase());
            if (existingIndex >= 0) {
                savedParties[existingIndex].members = players;
            } else {
                savedParties.push({ name: partyName.trim(), members: players });
            }
            
            savePartiesState();
            console.log(`Party "${partyName}" saved with ${players.length} members.`);
        }

        function loadParty(partyName) {
            const party = savedParties.find(p => p.name === partyName);
            if (!party) return;

            // Add each member to the encounter (default init to 0 so the DM can edit later)
            party.members.forEach(member => {
                addCombatant(member.name, 0, member.maxHp, member.role);
            });
        }


        // ==========================================
        // 2. CORE LOGIC / ACTIONS
        // ==========================================

        function addCombatant(name, init, maxHp, role) {
            const newCombatant = {
                id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                name: name.trim(),
                init: parseInt(init, 10),
                hp: parseInt(maxHp, 10),
                maxHp: parseInt(maxHp, 10),
                role: role,
                conditions: []
            };

            state.combatants.push(newCombatant);
            sortCombatants();
            
            if (!state.activeTurnId && state.combatants.length > 0) {
                state.activeTurnId = state.combatants[0].id;
            }

            updateAndRender();
        }

        function sortCombatants() {
            state.combatants.sort((a, b) => b.init - a.init);
        }

        function removeCombatant(id) {
            if (state.activeTurnId === id && state.combatants.length > 1) {
                nextTurn(false);
            }

            state.combatants = state.combatants.filter(c => c.id !== id);
            
            if (state.combatants.length === 0) {
                state.activeTurnId = null;
                state.round = 1;
            }

            updateAndRender();
        }

        function nextTurn(shouldRender = true) {
            if (state.combatants.length <= 1) return;

            const currentIndex = state.combatants.findIndex(c => c.id === state.activeTurnId);
            
            let nextIndex = currentIndex + 1;
            if (nextIndex >= state.combatants.length) {
                nextIndex = 0;
                state.round++;
            }

            state.activeTurnId = state.combatants[nextIndex].id;
            
            if (shouldRender) updateAndRender();
        }

        function modifyHP(id, changeAmount) {
            const combatant = state.combatants.find(c => c.id === id);
            if (combatant) {
                let newHp = combatant.hp + changeAmount;
                if (newHp < 0) newHp = 0; 
                combatant.hp = newHp;
                updateAndRender();
            }
        }

        function toggleCondition(id, condition) {
            const combatant = state.combatants.find(c => c.id === id);
            if (!combatant) return;

            const index = combatant.conditions.indexOf(condition);
            if (index === -1) {
                combatant.conditions.push(condition);
            } else {
                combatant.conditions.splice(index, 1);
            }
            updateAndRender();
        }

        function clearEncounter() {
            if(confirm("Are you sure you want to clear the entire encounter board? This cannot be undone.")) {
                state = {
                    combatants: [],
                    activeTurnId: null,
                    round: 1
                };
                updateAndRender();
            }
        }

        // ==========================================
        // 3. RENDERING ENGINE
        // ==========================================

        function updateAndRender() {
            saveState(); 
            render();    
        }

        function render() {
            const listEl = document.getElementById('initiative-list');
            const emptyEl = document.getElementById('empty-state');
            const countEl = document.getElementById('combatant-count');
            const roundEl = document.getElementById('round-display');

            countEl.textContent = `${state.combatants.length} Combatant${state.combatants.length !== 1 ? 's' : ''}`;
            roundEl.textContent = state.round;

            if (state.combatants.length === 0) {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                emptyEl.classList.add('flex');
                return;
            } else {
                emptyEl.classList.add('hidden');
                emptyEl.classList.remove('flex');
            }

            const html = state.combatants.map((combatant, index) => {
                const isActive = combatant.id === state.activeTurnId;
                
                const cardBaseStyle = "combatant-card relative bg-gray-900 border rounded-xl p-4 flex flex-col md:flex-row gap-4 items-center justify-between";
                const borderStyle = combatant.role === 'player' 
                    ? (isActive ? 'border-blue-400 shadow-[0_0_15px_rgba(96,165,250,0.3)] bg-gray-800' : 'border-blue-900/50') 
                    : (isActive ? 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.3)] bg-gray-800' : 'border-red-900/50');
                
                const roleIconColor = combatant.role === 'player' ? 'text-blue-400' : 'text-red-400';
                const hpColorClass = combatant.hp === 0 ? 'text-red-500 font-bold' : (combatant.hp <= combatant.maxHp / 4 ? 'text-orange-400' : 'text-white');

                const conditionsHtml = combatant.conditions.map(cond => `
                    <span class="inline-flex items-center gap-1 bg-yellow-900/30 text-yellow-300 text-xs px-2 py-1 rounded-md border border-yellow-700/50">
                        ${cond}
                        <button data-action="remove-condition" data-id="${combatant.id}" data-condition="${cond}" class="hover:text-white">&times;</button>
                    </span>
                `).join('');

                const selectOptions = `<option value="" disabled selected>+ Status</option>` + 
                    CONDITIONS.filter(c => !combatant.conditions.includes(c)).map(c => `<option value="${c}">${c}</option>`).join('');

                return `
                    <div class="${cardBaseStyle} ${borderStyle} ${isActive ? 'scale-[1.01]' : ''}">
                        
                        ${isActive ? '<div class="absolute -left-2 -top-2 bg-indigo-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow-lg z-10 animate-pulse">ACTIVE</div>' : ''}

                        <div class="flex items-center gap-4 w-full md:w-auto">
                            <div class="flex flex-col items-center justify-center bg-gray-950 border border-gray-800 rounded-lg w-14 h-14 shrink-0">
                                <span class="text-xs text-gray-500 font-medium">INIT</span>
                                <span class="text-xl font-bold text-white leading-none">${combatant.init}</span>
                            </div>
                            
                            <div class="flex-1 min-w-0">
                                <h3 class="text-lg font-bold text-white truncate flex items-center gap-2">
                                    ${combatant.name}
                                    <svg class="w-4 h-4 ${roleIconColor}" fill="currentColor" viewBox="0 0 20 20">
                                        ${combatant.role === 'player' 
                                            ? '<path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />' 
                                            : '<path fill-rule="evenodd" d="M9.999 1.815C8.948 3.197 7 5.617 7 7a3 3 0 106 0c0-1.383-1.948-3.803-2.999-5.185zM6 14a4 4 0 118 0v2a4 4 0 01-8 0v-2z" clip-rule="evenodd"/>'
                                        }
                                    </svg>
                                </h3>
                                
                                <div class="flex flex-wrap gap-1 mt-1 items-center">
                                    ${conditionsHtml}
                                    <select data-action="add-condition" data-id="${combatant.id}" class="bg-gray-950 border border-gray-700 text-gray-400 text-xs rounded py-1 px-1 focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer">
                                        ${selectOptions}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end border-t md:border-t-0 border-gray-800 pt-4 md:pt-0">
                            
                            <div class="flex items-center gap-2 bg-gray-950 rounded-lg p-1 border border-gray-800">
                                <div class="flex flex-col">
                                    <button data-action="hp-mod" data-amount="-5" data-id="${combatant.id}" class="text-xs text-red-400 hover:bg-gray-800 px-2 rounded font-mono">-5</button>
                                    <button data-action="hp-mod" data-amount="-1" data-id="${combatant.id}" class="text-xs text-red-300 hover:bg-gray-800 px-2 rounded font-mono">-1</button>
                                </div>
                                
                                <div class="text-center px-2 min-w-[70px]">
                                    <span class="text-xs text-gray-500 block leading-tight">HP</span>
                                    <span class="text-xl font-bold ${hpColorClass} leading-tight">${combatant.hp}</span>
                                    <span class="text-xs text-gray-500 block leading-tight">/ ${combatant.maxHp}</span>
                                </div>
                                
                                <div class="flex flex-col">
                                    <button data-action="hp-mod" data-amount="5" data-id="${combatant.id}" class="text-xs text-green-400 hover:bg-gray-800 px-2 rounded font-mono">+5</button>
                                    <button data-action="hp-mod" data-amount="1" data-id="${combatant.id}" class="text-xs text-green-300 hover:bg-gray-800 px-2 rounded font-mono">+1</button>
                                </div>
                            </div>

                            <div class="flex items-center gap-1">
                                <input type="number" id="custom-hp-${combatant.id}" class="w-14 bg-gray-850 border border-gray-700 text-white text-sm rounded py-1.5 px-2 text-center" placeholder="0">
                                <div class="flex flex-col gap-1">
                                    <button data-action="custom-dmg" data-id="${combatant.id}" class="bg-red-900/50 hover:bg-red-700 text-red-200 text-[10px] uppercase font-bold px-1.5 py-0.5 rounded" title="Damage">Dmg</button>
                                    <button data-action="custom-heal" data-id="${combatant.id}" class="bg-green-900/50 hover:bg-green-700 text-green-200 text-[10px] uppercase font-bold px-1.5 py-0.5 rounded" title="Heal">Heal</button>
                                </div>
                            </div>

                            <button data-action="delete" data-id="${combatant.id}" class="text-gray-500 hover:text-red-400 p-2 transition-colors ml-2" title="Remove Combatant">
                                <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            listEl.innerHTML = html;
        }

        // ==========================================
        // 4. EVENT LISTENERS
        // ==========================================

        document.addEventListener('DOMContentLoaded', () => {
            
            loadState();
            render();

            document.getElementById('add-combatant-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('input-name').value;
                const init = document.getElementById('input-init').value;
                const hp = document.getElementById('input-hp').value;
                const role = document.querySelector('input[name="role"]:checked').value;
                
                addCombatant(name, init, hp, role);
                
                document.getElementById('input-name').value = '';
                document.getElementById('input-init').value = '';
                document.getElementById('input-hp').value = '';
                document.getElementById('input-name').focus(); 
            });

            document.getElementById('btn-next-turn').addEventListener('click', () => {
                nextTurn(true);
            });

            document.getElementById('btn-clear').addEventListener('click', clearEncounter);

            document.getElementById('initiative-list').addEventListener('click', (e) => {
                const actionEl = e.target.closest('[data-action]');
                if (!actionEl) return;

                const action = actionEl.dataset.action;
                const id = actionEl.dataset.id;

                if (action === 'delete') {
                    removeCombatant(id);
                } 
                else if (action === 'hp-mod') {
                    const amount = parseInt(actionEl.dataset.amount, 10);
                    modifyHP(id, amount);
                }
                else if (action === 'custom-dmg' || action === 'custom-heal') {
                    const inputEl = document.getElementById(`custom-hp-${id}`);
                    const val = parseInt(inputEl.value, 10);
                    if (!val || isNaN(val)) return; 
                    
                    const multiplier = action === 'custom-dmg' ? -1 : 1;
                    modifyHP(id, val * multiplier);
                    inputEl.value = ''; 
                }
                else if (action === 'remove-condition') {
                    const condition = actionEl.dataset.condition;
                    toggleCondition(id, condition);
                }
            });

            document.getElementById('initiative-list').addEventListener('change', (e) => {
                if (e.target.dataset.action === 'add-condition') {
                    const id = e.target.dataset.id;
                    const condition = e.target.value;
                    if (condition) {
                        toggleCondition(id, condition);
                        e.target.value = ""; 
                    }
                }
            });
        });

    </script>
</body>
</html>
